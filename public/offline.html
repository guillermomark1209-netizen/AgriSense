<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1B4332"><title>AgriSense · Offline</title><style>body{background:#f7f8f5;color:#26302a;font:15px/1.7 system-ui;margin:0;padding:40px 22px}main{max-width:620px;margin:8vh auto;padding:30px;border:1px solid #e4e7e1;border-radius:12px;background:white}h1{color:#1b4332}a,button{display:inline-block;background:#2d6a4f;color:white;padding:10px 16px;border:0;border-radius:8px;font:inherit;text-decoration:none;margin:12px 5px 0 0}small{color:#68736c}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}dd{margin:0}</style><main><small>AGRISENSE · OFFLINE MODE</small><h1>Your field connection is resting.</h1><p>Connect to the internet to sign in, send readings, or make changes.</p><section id="snapshot"><p>No saved snapshot is available on this device.</p></section><a href="./dashboard">Try reconnecting</a><button id="clear">Remove saved snapshot</button><p id="status" role="status"></p></main><script>
const request=indexedDB.open('agrisense-offline',1);request.onupgradeneeded=()=>request.result.createObjectStore('snapshots');request.onsuccess=()=>{const db=request.result;const enabled=localStorage.getItem('agrisense-save-offline'),owner=localStorage.getItem('agrisense-offline-owner');if(enabled&&enabled===owner){const read=db.transaction('snapshots').objectStore('snapshots').get('latest');read.onsuccess=()=>{const data=read.result;if(!data)return;const section=document.querySelector('#snapshot');section.replaceChildren();const title=document.createElement('h2');title.textContent='Saved monitoring snapshot · NOT LIVE';section.append(title);const time=document.createElement('p');time.textContent='Last synchronized: '+new Date(data.synced_at).toLocaleString();section.append(time);const list=document.createElement('dl');for(const key of ['temperature','humidity','soil_moisture','soil_ph','light_intensity']){const term=document.createElement('dt');term.textContent=key.replaceAll('_',' ');const value=document.createElement('dd');value.textContent=data.latest?.[key]??'No reading';list.append(term,value);}section.append(list);};}document.querySelector('#clear').onclick=()=>{const tx=db.transaction('snapshots','readwrite');tx.objectStore('snapshots').clear();localStorage.removeItem('agrisense-save-offline');localStorage.removeItem('agrisense-offline-owner');document.querySelector('#snapshot').textContent='Saved snapshots removed.';};};
</script></html>
